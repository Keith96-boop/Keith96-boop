# GitHub Actions workflow: auto-update the profile README.
# 1. Refreshes the "Recent Projects" block from your most recent public repos.
# 2. Regenerates a static "commit activity" graph image and commits it into the
#    repo, so the profile never depends on a flaky third-party graph service.
#
# Runs on every push to main, on a 24h schedule, and via manual dispatch.

name: Auto-update profile README

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch recent public repositories
        run: |
          OWNER="${{ github.repository_owner }}"
          # Keep the 6 most recently pushed public repos, excluding the profile repo.
          # Default to an empty array so the step never writes `null`.
          curl -s -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${OWNER}/repos?per_page=30&sort=pushed&order=desc&type=public" \
            | jq -c 'if (type == "array") then ([ .[] | select(.name != "Keith96-boop") | {name, description, html_url, language, stargazers_count} ][0:6]) else [] end' \
            > "$GITHUB_WORKSPACE/recent_repos.json"
          echo "--- recent_repos.json ---"
          cat "$GITHUB_WORKSPACE/recent_repos.json"

      - name: Generate the Recent Projects section
        run: |
          node - <<'EOF'
          const fs = require('fs');
          let repos = [];
          try {
            const raw = JSON.parse(fs.readFileSync('recent_repos.json', 'utf8'));
            if (Array.isArray(raw)) {
              repos = raw;
            }
          } catch (e) {
            console.warn('Could not parse recent_repos.json; using empty list.');
          }

          const markerStart = '<!-- AUTO:RECENT:START -->';
          const markerEnd = '<!-- AUTO:RECENT:END -->';

          function cell(r) {
            const name = r.name || 'Untitled';
            const desc = r.description || 'No description available.';
            const lang = r.language || 'N/A';
            const stars = (r.stargazers_count != null) ? r.stargazers_count : 0;
            const safeName = String(name).replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const safeDesc = String(desc).replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const safeLang = String(lang).replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const safeStars = String(stars).replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return `<td align="center" width="33%">

<div style="background:#FFFFFF;border:1px solid #30363d;border-radius:14px;padding:20px;">

<h3 style="margin:0 0 8px;font-size:20px;color:#111111;">${safeName}</h3>

<p style="color:#30363d;font-size:14px;line-height:1.6;margin:0 0 14px;">${safeDesc}</p>

<p style="margin:0;font-size:12px;"><code style="background:#30363d;color:#ffffff;padding:3px 9px;border-radius:7px;">${safeLang}</code> &nbsp; &star; ${safeStars}</p>

</div>

</td>`;
          }

          let rows = [];
          for (let i = 0; i < repos.length; i += 3) {
            rows.push(`<tr>\n${repos.slice(i, i + 3).map(cell).join('\n')}</tr>`);
          }

          const table = rows.length ? `<table>\n${rows.join('\n')}\n</table>` : '_No public projects found yet._';

          const section = [
            markerStart,
            '',
            table,
            '',
            markerEnd,
          ].join('\n');

          let readme = fs.readFileSync('README.md', 'utf8');
          const re = new RegExp(markerStart.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&') + '[\\s\\S]*?' + markerEnd.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&'));
          if (re.test(readme)) {
            readme = readme.replace(re, section);
          } else {
            readme = readme.trimEnd() + '\n\n' + section + '\n';
          }
          fs.writeFileSync('README.md', readme);
          console.log('Wrote README.md with ' + repos.length + ' recent repo(s).');
          EOF

      - name: Generate commit activity graph image (self-hosted, static)
        run: |
          # Use a reliable commit-activity service; download the image into the repo
          # so the profile never depends on the service being up at view time.
          OUT="assets/commit_activity.png"
          mkdir -p assets
          # Try a couple of known-good hosts; stop at the first one that returns a non-empty file.
          url1="https://gh-graphs.vercel.app/commit-graph?username=${{ github.repository_owner }}&theme=react-dark&color=111111&bg_color=FFFFFF&line=30363d"
          url2="https://git.io/commit-graph?username=${{ github.repository_owner }}"
          if curl -sL -o "$OUT" "$url1" && [ -s "$OUT" ]; then
            echo "Wrote $OUT from url1 ($(stat -c%s "$OUT") bytes)."
          elif curl -sL -o "$OUT" "$url2" && [ -s "$OUT" ]; then
            echo "Wrote $OUT from url2 ($(stat -c%s "$OUT") bytes)."
          else
            echo "Activity service unavailable; leaving any existing image in place."
            # Drop a zero-length marker so the commit step below is a no-op
            rm -f "$OUT"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          # Only stage the activity image if it actually exists on disk.
          if [ -f assets/commit_activity.png ]; then
            git add assets/commit_activity.png
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit; README is already up to date."
          else
            git commit -m "chore: auto-update Recent Projects and commit activity graph"
            git push
          fi
