<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </radialGradient>
    <linearGradient id="segA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B07CFF"/><stop offset="100%" stop-color="#8B35FF"/>
    </linearGradient>
    <linearGradient id="segB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FB6FF"/><stop offset="100%" stop-color="#4C8BE8"/>
    </linearGradient>
    <linearGradient id="segC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B35FF"/><stop offset="100%" stop-color="#6C2BD9"/>
    </linearGradient>
    <linearGradient id="segD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#C9C9D8"/>
    </linearGradient>
    <linearGradient id="segE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C2E8F"/><stop offset="100%" stop-color="#8B35FF"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B07CFF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="420" rx="20" fill="url(#bgGrad)"/>

  <!-- Connector arrows: from each side panel toward the ring -->
  <!-- Left side panels: A (top), B (mid), C (bottom) -->
  <line x1="180" y1="80"  x2="255" y2="120" stroke="#B07CFF" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <line x1="180" y1="210" x2="255" y2="210" stroke="#B07CFF" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <line x1="180" y1="340" x2="255" y2="300" stroke="#B07CFF" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- Right side panels: D (top), E (bottom) -->
  <line x1="460" y1="80"  x2="385" y2="120" stroke="#B07CFF" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <line x1="460" y1="340" x2="385" y2="300" stroke="#B07CFF" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Donut center ring -->
  <circle cx="320" cy="210" r="96" fill="none" stroke="#151022" stroke-width="34"/>

  <!-- Segments (dasharray of circumference ~603.19) -->
  <!-- A: Languages & Frontend 35% -->
  <circle cx="320" cy="210" r="96" fill="none" stroke="url(#segA)" stroke-width="34"
          stroke-dasharray="211.1 392.1" stroke-dashoffset="0"
          transform="rotate(-90 320 210)" stroke-linecap="butt"/>
  <!-- B: Backend & Data 30% -->
  <circle cx="320" cy="210" r="96" fill="none" stroke="url(#segB)" stroke-width="34"
          stroke-dasharray="181 422.2" stroke-dashoffset="-211.1"
          transform="rotate(-90 320 210)" stroke-linecap="butt"/>
  <!-- C: Tools & Platforms 20% -->
  <circle cx="320" cy="210" r="96" fill="none" stroke="url(#segC)" stroke-width="34"
          stroke-dasharray="120.6 482.6" stroke-dashoffset="-392.1"
          transform="rotate(-90 320 210)" stroke-linecap="butt"/>
  <!-- D: Design 10% -->
  <circle cx="320" cy="210" r="96" fill="none" stroke="url(#segD)" stroke-width="34"
          stroke-dasharray="60.3 542.9" stroke-dashoffset="-512.7"
          transform="rotate(-90 320 210)" stroke-linecap="butt"/>
  <!-- E: Others 5% -->
  <circle cx="320" cy="210" r="96" fill="none" stroke="url(#segE)" stroke-width="34"
          stroke-dasharray="30.2 573" stroke-dashoffset="-573"
          transform="rotate(-90 320 210)" stroke-linecap="butt"/>

  <!-- Center -->
  <circle cx="320" cy="210" r="68" fill="#0a0a10" stroke="#2a1f44" stroke-width="2"/>

  <!-- GitHub logo -->
  <g transform="translate(292,160)" fill="#ffffff" filter="url(#glow)">
    <path d="M26 0C11.6 0 0 11.6 0 26c0 11.4 7.4 21.2 17.7 24.6
             1.3.2 1.8-.6 1.8-1.2v-4.3c-7.2 1.6-8.7-3.4-8.7-3.4-1.2-3-2.9-3.8-2.9-3.8-2.3-1.6.2-1.6.2-1.6
             2.6.2 3.9 2.7 3.9 2.7 2.3 4 6 2.8 7.4 2.1.2-1.7.9-2.8 1.6-3.4-5.5-.7-11.3-2.8-11.3-12.3
             0-2.7 1-5 2.6-6.7-.3-.6-1.1-3.2.2-6.6 0 0 2.1-.7 7 2.6
             a24 24 0 0 1 12.6 0c4.8-3.3 6.9-2.6 6.9-2.6 1.4 3.4.6 6 .2 6.6
             1.6 1.7 2.6 4 2.6 6.7 0 9.6-5.9 11.6-11.4 12.4.9.8 1.7 2.3 1.7 4.7
             0 3.4.3 6.1 1.7 7.9 0 0 2.7 1 6.8-3.9 0 0 1.4 1.3 4.3 1.5v.2
             c0 .6.5 1.4 1.8 1.2C48.6 47.2 56 37.4 56 26 56 11.6 44.4 0 26 0z"/>
  </g>

  <text x="320" y="242" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">My Tech Stack</text>
  <text x="320" y="262" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="12">Building · Creating · Innovating</text>

  <!-- Glow connection points at segment midpoints -->
  <g fill="#B07CFF" filter="url(#glow)">
    <circle cx="320" cy="114" r="5"/>
    <circle cx="407" cy="152" r="5"/>
    <circle cx="407" cy="268" r="5"/>
    <circle cx="233" cy="268" r="5"/>
    <circle cx="233" cy="152" r="5"/>
  </g>
</svg>
