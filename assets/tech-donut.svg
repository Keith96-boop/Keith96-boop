<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#171028"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </radialGradient>
    <linearGradient id="segA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B35FF"/>
      <stop offset="100%" stop-color="#6C2BD9"/>
    </linearGradient>
    <linearGradient id="segB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B07CFF"/>
      <stop offset="100%" stop-color="#8B35FF"/>
    </linearGradient>
    <linearGradient id="segC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FB6FF"/>
      <stop offset="100%" stop-color="#4C8BE8"/>
    </linearGradient>
    <linearGradient id="segD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9C9D8"/>
    </linearGradient>
    <linearGradient id="segE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C2E8F"/>
      <stop offset="100%" stop-color="#8B35FF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#bgGrad)"/>

  <!-- Donut ring base -->
  <circle cx="160" cy="160" r="96" fill="none" stroke="#151022" stroke-width="34"/>

  <!-- Segments (stroke-dasharray of circumference 2*pi*96 ~= 603.19) -->
  <!-- Languages & Frontend 35% -->
  <circle cx="160" cy="160" r="96" fill="none" stroke="url(#segA)" stroke-width="34"
          stroke-dasharray="211.1 392.1" stroke-dashoffset="0" stroke-linecap="butt"
          transform="rotate(-90 160 160)"/>
  <!-- Backend & Data 30% -->
  <circle cx="160" cy="160" r="96" fill="none" stroke="url(#segB)" stroke-width="34"
          stroke-dasharray="181 422.2" stroke-dashoffset="-211.1" stroke-linecap="butt"
          transform="rotate(-90 160 160)"/>
  <!-- Tools & Platforms 20% -->
  <circle cx="160" cy="160" r="96" fill="none" stroke="url(#segC)" stroke-width="34"
          stroke-dasharray="120.6 482.6" stroke-dashoffset="-392.1" stroke-linecap="butt"
          transform="rotate(-90 160 160)"/>
  <!-- Design 10% -->
  <circle cx="160" cy="160" r="96" fill="none" stroke="url(#segD)" stroke-width="34"
          stroke-dasharray="60.3 542.9" stroke-dashoffset="-512.7" stroke-linecap="butt"
          transform="rotate(-90 160 160)"/>
  <!-- Others 5% -->
  <circle cx="160" cy="160" r="96" fill="none" stroke="url(#segE)" stroke-width="34"
          stroke-dasharray="30.2 573" stroke-dashoffset="-573" stroke-linecap="butt"
          transform="rotate(-90 160 160)"/>

  <!-- Center circle -->
  <circle cx="160" cy="160" r="68" fill="#0a0a10" stroke="#2a1f44" stroke-width="2"/>

  <!-- GitHub logo (octocat mark) -->
  <g transform="translate(132,116)" fill="#ffffff" filter="url(#glow)">
    <path d="M26 0C11.6 0 0 11.6 0 26c0 11.4 7.4 21.2 17.7 24.6
             1.3.2 1.8-.6 1.8-1.2v-4.3c-7.2 1.6-8.7-3.4-8.7-3.4-1.2-3-2.9-3.8-2.9-3.8-2.3-1.6.2-1.6.2-1.6
             2.6.2 3.9 2.7 3.9 2.7 2.3 4 6 2.8 7.4 2.1.2-1.7.9-2.8 1.6-3.4-5.5-.7-11.3-2.8-11.3-12.3
             0-2.7 1-5 2.6-6.7-.3-.6-1.1-3.2.2-6.6 0 0 2.1-.7 7 2.6
             a24 24 0 0 1 12.6 0c4.8-3.3 6.9-2.6 6.9-2.6 1.4 3.4.6 6 .2 6.6
             1.6 1.7 2.6 4 2.6 6.7 0 9.6-5.9 11.6-11.4 12.4.9.8 1.7 2.3 1.7 4.7
             0 3.4.3 6.1 1.7 7.9 0 0 2.7 1 6.8-3.9 0 0 1.4 1.3 4.3 1.5v.2
             c0 .6.5 1.4 1.8 1.2C48.6 47.2 56 37.4 56 26 56 11.6 44.4 0 26 0z"/>
  </g>

  <text x="160" y="192" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">My Tech Stack</text>
  <text x="160" y="212" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="12">Building · Creating · Innovating</text>

  <!-- Connection dots around the ring (glow points) -->
  <g fill="#B07CFF" filter="url(#glow)">
    <circle cx="160" cy="46" r="5"/>
    <circle cx="254" cy="102" r="5"/>
    <circle cx="248" cy="218" r="5"/>
    <circle cx="72" cy="218" r="5"/>
    <circle cx="66" cy="102" r="5"/>
  </g>
</svg>
